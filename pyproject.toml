[project]
name = "popper"
version = "0.1.0"
description = "Autonomous trading-strategy research platform — falsification-first alpha discovery"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
supabase = ["supabase>=2.4"]
dev = ["pytest>=8.0"]

[project.scripts]
popper = "popper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["popper", "popper.artifacts", "popper.memory", "popper.api"]
